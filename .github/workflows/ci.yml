name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: secops
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: secops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U secops -d secops"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://secops:synthetic-ci-only-password@127.0.0.1:5432/secops
      JWT_SECRET: synthetic-ci-only-signing-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install uv==0.13.9
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
